<section class="legal tone-a" aria-label="{{ s.label }}">
  <div class="legal-body">
    <p class="legal-updated mono">{{ s.updated }}</p>
    {% for part in s.parts %}<section class="legal-part" id="{{ part.id }}" aria-labelledby="{{ part.id }}-title">
      <h2 id="{{ part.id }}-title">{{ part.title }}</h2>
      {% for p in part.paragraphs %}<p>{{ p }}</p>
      {% endfor %}
      {% if part.list %}<ul>
        {% for li in part.list %}<li>{{ li }}</li>
        {% endfor %}
      </ul>{% endif %}
    </section>
    {% endfor %}
  </div>
</section>
